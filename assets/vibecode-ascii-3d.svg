<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="100%" height="100%">
  <defs>
    <linearGradient id="bgVibe" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08080a" />
      <stop offset="100%" stop-color="#0a0a0d" />
    </linearGradient>

    <linearGradient id="cardGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15151b" />
      <stop offset="40%" stop-color="#101015" />
      <stop offset="100%" stop-color="#131319" />
    </linearGradient>

    <!-- 3D Monochrome Cube Faces -->
    <linearGradient id="isoTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2c36" />
      <stop offset="100%" stop-color="#1b1b22" />
    </linearGradient>
    <linearGradient id="isoLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#18181f" />
      <stop offset="100%" stop-color="#0d0d11" />
    </linearGradient>
    <linearGradient id="isoRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111116" />
      <stop offset="100%" stop-color="#08080b" />
    </linearGradient>

    <filter id="cardDrop" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="12" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <style>
    .sans { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: 'Geist Mono', 'JetBrains Mono', 'Fira Code', Consolas, monospace; }

    @keyframes floatCube {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes glyphPulse {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.75; }
    }

    .cube-a { animation: floatCube 4.2s ease-in-out infinite; }
    .cube-b { animation: floatCube 4.2s ease-in-out infinite 0.6s; }
    .cube-c { animation: floatCube 4.2s ease-in-out infinite 1.2s; }
    .glyph-anim { animation: glyphPulse 2.6s steps(3, end) infinite; }
  </style>

  <!-- Carbon Background -->
  <rect width="960" height="540" rx="16" fill="url(#bgVibe)" />

  <!-- Architectural Frame & Dividers -->
  <rect x="24" y="16" width="912" height="508" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1" />
  <line x1="24" y1="88" x2="936" y2="88" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1" />
  <line x1="24" y1="478" x2="936" y2="478" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1" />

  <!-- Corner Crosshair '+' Marks -->
  <g stroke="#ffffff" stroke-opacity="0.32" stroke-width="1">
    <line x1="18" y1="88" x2="30" y2="88" /><line x1="24" y1="82" x2="24" y2="94" />
    <line x1="930" y1="88" x2="942" y2="88" /><line x1="936" y1="82" x2="936" y2="94" />
    <line x1="18" y1="478" x2="30" y2="478" /><line x1="24" y1="472" x2="24" y2="484" />
    <line x1="930" y1="478" x2="942" y2="478" /><line x1="936" y1="472" x2="936" y2="484" />
  </g>

  <!-- Section Header (.demo-head) -->
  <g transform="translate(48, 44)">
    <text x="0" y="0" fill="#878791" font-size="11.5" font-weight="500" letter-spacing="1.2" class="mono">
      01 // AI-NATIVE ENGINEERING WORKFLOW (1+ YEAR PRODUCTION)
    </text>
    <text x="0" y="26" fill="#ededef" font-size="24" font-weight="600" letter-spacing="-0.8" class="sans">
      Multi-Agent Vibecoding Matrix
    </text>
    <text x="864" y="24" text-anchor="end" fill="#878791" font-size="12" class="mono">
      MODE: <tspan fill="#3dd68c">SPEC-DRIVEN 3D</tspan> · VELOCITY: <tspan fill="#ededef">3.5x</tspan>
    </text>
  </g>

  <!-- ========================================================= -->
  <!-- CARD 01: CLAUDE (ARCHITECT & DEEP REASONING)              -->
  <!-- ========================================================= -->
  <g transform="translate(46, 110)" filter="url(#cardDrop)">
    <!-- 3D Extruded Base Shadow -->
    <rect x="4" y="6" width="276" height="346" rx="18" fill="#040406" stroke="#ffffff" stroke-opacity="0.06" />
    <!-- Main Dark Glass Surface -->
    <rect x="0" y="0" width="276" height="346" rx="18" fill="url(#cardGlass)" stroke="#ffffff" stroke-opacity="0.13" stroke-width="1" />
    <!-- Top Specular Rim -->
    <line x1="18" y1="1" x2="258" y2="1" stroke="#ffffff" stroke-opacity="0.24" stroke-width="1" />

    <!-- Eyebrow + Chip -->
    <text x="22" y="32" fill="#878791" font-size="11" font-weight="500" letter-spacing="1" class="mono">AGENT 01 // ARCHITECT</text>
    <rect x="192" y="18" width="64" height="20" rx="10" fill="#3dd68c" fill-opacity="0.14" stroke="#3dd68c" stroke-opacity="0.3" />
    <text x="224" y="32" text-anchor="middle" fill="#3dd68c" font-size="10.5" font-weight="600" class="mono">1+ YR</text>

    <!-- Title -->
    <text x="22" y="58" fill="#ededef" font-size="20" font-weight="600" letter-spacing="-0.4" class="sans">Claude (Anthropic)</text>

    <!-- Sunken 3D + ASCII Viewport -->
    <rect x="20" y="72" width="236" height="122" rx="12" fill="#070709" stroke="#ffffff" stroke-opacity="0.08" />
    <g font-size="10" class="mono" fill="#ffffff" fill-opacity="0.16" letter-spacing="2">
      <text x="32" y="92" class="glyph-anim">░ ▒ ▓ + · : : · + ▓ ▒ ░</text>
      <text x="32" y="180" class="glyph-anim">· : + # D D D _ S Q L # +</text>
    </g>
    <!-- Large 3D Isometric Cube inside Viewport -->
    <g class="cube-a" transform="translate(138, 128)">
      <polygon points="0,-38 56,-14 0,10 -56,-14" fill="url(#isoTop)" stroke="#f5c27a" stroke-opacity="0.7" stroke-width="1.2" />
      <polygon points="-56,-14 0,10 0,46 -56,22" fill="url(#isoLeft)" stroke="#ffffff" stroke-opacity="0.18" />
      <polygon points="56,-14 0,10 0,46 56,22" fill="url(#isoRight)" stroke="#ffffff" stroke-opacity="0.12" />
      <text x="0" y="-11" text-anchor="middle" fill="#f5c27a" font-size="10.5" font-weight="600" class="mono">DDD · SQL</text>
    </g>

    <!-- Big Metric (.big) -->
    <text x="22" y="232" fill="#ededef" font-size="32" font-weight="600" letter-spacing="-1.2" class="mono">95%</text>
    <text x="100" y="226" fill="#a3a3ac" font-size="12.5" font-weight="400" class="sans">Spec-to-Architecture</text>
    <text x="100" y="242" fill="#878791" font-size="11.5" class="mono">precision score</text>

    <!-- Data Rows (.rows dt / dd) -->
    <line x1="22" y1="256" x2="254" y2="256" stroke="#ffffff" stroke-opacity="0.09" />
    <text x="22" y="274" fill="#878791" font-size="11" class="mono">ROLE</text>
    <text x="254" y="274" text-anchor="end" fill="#ededef" font-size="12.5" font-weight="500" class="sans">System Design &amp; DDD</text>

    <line x1="22" y1="286" x2="254" y2="286" stroke="#ffffff" stroke-opacity="0.09" />
    <text x="22" y="304" fill="#878791" font-size="11" class="mono">CORE</text>
    <text x="254" y="304" text-anchor="end" fill="#f5c27a" font-size="12" font-weight="500" class="mono">Go · Java · PostgreSQL</text>

    <line x1="22" y1="316" x2="254" y2="316" stroke="#ffffff" stroke-opacity="0.09" />
    <text x="22" y="334" fill="#878791" font-size="11" class="mono">AUDIT</text>
    <text x="254" y="334" text-anchor="end" fill="#a3a3ac" font-size="12" class="sans">Concurrency &amp; Security</text>
  </g>

  <!-- ========================================================= -->
  <!-- CARD 02: OPENAI CODEX (HIGH-VELOCITY EXECUTION)           -->
  <!-- ========================================================= -->
  <g transform="translate(342, 110)" filter="url(#cardDrop)">
    <rect x="4" y="6" width="276" height="346" rx="18" fill="#040406" stroke="#ffffff" stroke-opacity="0.06" />
    <rect x="0" y="0" width="276" height="346" rx="18" fill="url(#cardGlass)" stroke="#ffffff" stroke-opacity="0.13" stroke-width="1" />
    <line x1="18" y1="1" x2="258" y2="1" stroke="#ffffff" stroke-opacity="0.24" stroke-width="1" />

    <text x="22" y="32" fill="#878791" font-size="11" font-weight="500" letter-spacing="1" class="mono">AGENT 02 // VELOCITY</text>
    <rect x="192" y="18" width="64" height="20" rx="10" fill="#3dd68c" fill-opacity="0.14" stroke="#3dd68c" stroke-opacity="0.3" />
    <text x="224" y="32" text-anchor="middle" fill="#3dd68c" font-size="10.5" font-weight="600" class="mono">1+ YR</text>

    <text x="22" y="58" fill="#ededef" font-size="20" font-weight="600" letter-spacing="-0.4" class="sans">OpenAI Codex</text>

    <!-- Sunken 3D + ASCII Viewport -->
    <rect x="20" y="72" width="236" height="122" rx="12" fill="#070709" stroke="#ffffff" stroke-opacity="0.08" />
    <g font-size="10" class="mono" fill="#ffffff" fill-opacity="0.16" letter-spacing="2">
      <text x="32" y="92" class="glyph-anim">▓ █ ▓ : · + * + · : ▓ █</text>
      <text x="32" y="180" class="glyph-anim">+ · : [ A P I _ T E S T ]</text>
    </g>
    <!-- Large 3D Isometric Dual-Stack inside Viewport -->
    <g class="cube-b" transform="translate(138, 128)">
      <polygon points="0,-38 56,-14 0,10 -56,-14" fill="url(#isoTop)" stroke="#7ee2b8" stroke-opacity="0.7" stroke-width="1.2" />
      <polygon points="-56,-14 0,10 0,46 -56,22" fill="url(#isoLeft)" stroke="#ffffff" stroke-opacity="0.18" />
      <polygon points="56,-14 0,10 0,46 56,22" fill="url(#isoRight)" stroke="#ffffff" stroke-opacity="0.12" />
      <text x="0" y="-11" text-anchor="middle" fill="#7ee2b8" font-size="10.5" font-weight="600" class="mono">API · TEST</text>
    </g>

    <!-- Big Metric -->
    <text x="22" y="232" fill="#ededef" font-size="32" font-weight="600" letter-spacing="-1.2" class="mono">4.0x</text>
    <text x="104" y="226" fill="#a3a3ac" font-size="12.5" font-weight="400" class="sans">Scaffolding &amp; Test</text>
    <text x="104" y="242" fill="#878791" font-size="11.5" class="mono">synthesis speed</text>

    <!-- Data Rows -->
    <line x1="22" y1="256" x2="254" y2="256" stroke="#ffffff" stroke-opacity="0.09" />
    <text x="22" y="274" fill="#878791" font-size="11" class="mono">ROLE</text>
    <text x="254" y="274" text-anchor="end" fill="#ededef" font-size="12.5" font-weight="500" class="sans">Rapid Code &amp; Unit Tests</text>

    <line x1="22" y1="286" x2="254" y2="286" stroke="#ffffff" stroke-opacity="0.09" />
    <text x="22" y="304" fill="#878791" font-size="11" class="mono">CORE</text>
    <text x="254" y="304" text-anchor="end" fill="#7ee2b8" font-size="12" font-weight="500" class="mono">REST · gRPC · Docker</text>

    <line x1="22" y1="316" x2="254" y2="316" stroke="#ffffff" stroke-opacity="0.09" />
    <text x="22" y="334" fill="#878791" font-size="11" class="mono">CI/CD</text>
    <text x="254" y="334" text-anchor="end" fill="#a3a3ac" font-size="12" class="sans">Multi-Repo Bug Triage</text>
  </g>

  <!-- ========================================================= -->
  <!-- CARD 03: ANTIGRAVITY (AGENTIC FULL-STACK ORCHESTRATOR)    -->
  <!-- ========================================================= -->
  <g transform="translate(638, 110)" filter="url(#cardDrop)">
    <rect x="4" y="6" width="276" height="346" rx="18" fill="#040406" stroke="#ffffff" stroke-opacity="0.06" />
    <rect x="0" y="0" width="276" height="346" rx="18" fill="url(#cardGlass)" stroke="#ffffff" stroke-opacity="0.13" stroke-width="1" />
    <line x1="18" y1="1" x2="258" y2="1" stroke="#ffffff" stroke-opacity="0.24" stroke-width="1" />

    <text x="22" y="32" fill="#878791" font-size="11" font-weight="500" letter-spacing="1" class="mono">AGENT 03 // AGENTIC IDE</text>
    <rect x="192" y="18" width="64" height="20" rx="10" fill="#3dd68c" fill-opacity="0.14" stroke="#3dd68c" stroke-opacity="0.3" />
    <text x="224" y="32" text-anchor="middle" fill="#3dd68c" font-size="10.5" font-weight="600" class="mono">1+ YR</text>

    <text x="22" y="58" fill="#ededef" font-size="20" font-weight="600" letter-spacing="-0.4" class="sans">Antigravity</text>

    <!-- Sunken 3D + ASCII Viewport -->
    <rect x="20" y="72" width="236" height="122" rx="12" fill="#070709" stroke="#ffffff" stroke-opacity="0.08" />
    <g font-size="10" class="mono" fill="#ffffff" fill-opacity="0.16" letter-spacing="2">
      <text x="32" y="92" class="glyph-anim">░ ▒ █ # @ * + * @ # █ ▒</text>
      <text x="32" y="180" class="glyph-anim">· : { M C P _ S K I L L }</text>
    </g>
    <!-- Large 3D Isometric Cube inside Viewport -->
    <g class="cube-c" transform="translate(138, 128)">
      <polygon points="0,-38 56,-14 0,10 -56,-14" fill="url(#isoTop)" stroke="#7cc4ff" stroke-opacity="0.75" stroke-width="1.2" />
      <polygon points="-56,-14 0,10 0,46 -56,22" fill="url(#isoLeft)" stroke="#ffffff" stroke-opacity="0.18" />
      <polygon points="56,-14 0,10 0,46 56,22" fill="url(#isoRight)" stroke="#ffffff" stroke-opacity="0.12" />
      <text x="0" y="-11" text-anchor="middle" fill="#7cc4ff" font-size="10.5" font-weight="600" class="mono">MCP · SKILL</text>
    </g>

    <!-- Big Metric -->
    <text x="22" y="232" fill="#ededef" font-size="32" font-weight="600" letter-spacing="-1.2" class="mono">10x</text>
    <text x="92" y="226" fill="#a3a3ac" font-size="12.5" font-weight="400" class="sans">Full-Stack &amp; 3D</text>
    <text x="92" y="242" fill="#878791" font-size="11.5" class="mono">autonomous delivery</text>

    <!-- Data Rows -->
    <line x1="22" y1="256" x2="254" y2="256" stroke="#ffffff" stroke-opacity="0.09" />
    <text x="22" y="274" fill="#878791" font-size="11" class="mono">ROLE</text>
    <text x="254" y="274" text-anchor="end" fill="#ededef" font-size="12.5" font-weight="500" class="sans">Multi-Agent Orchestrator</text>

    <line x1="22" y1="286" x2="254" y2="286" stroke="#ffffff" stroke-opacity="0.09" />
    <text x="22" y="304" fill="#878791" font-size="11" class="mono">TOOLS</text>
    <text x="254" y="304" text-anchor="end" fill="#7cc4ff" font-size="12" font-weight="500" class="mono">SKILL.md · Rules · MCP</text>

    <line x1="22" y1="316" x2="254" y2="316" stroke="#ffffff" stroke-opacity="0.09" />
    <text x="22" y="334" fill="#878791" font-size="11" class="mono">SCOPE</text>
    <text x="254" y="334" text-anchor="end" fill="#a3a3ac" font-size="12" class="sans">Web · Mobile · Desktop</text>
  </g>

  <!-- Bottom Code Snippet Bar -->
  <g transform="translate(48, 504)" font-size="12" class="mono">
    <text x="0" y="0" fill="#878791">
      <tspan fill="#ff8fb7">export const</tspan> <tspan fill="#7cc4ff">vibecodePipeline</tspan> = [<tspan fill="#7ee2b8">'Claude::Architect'</tspan>, <tspan fill="#7ee2b8">'Codex::Synthesize'</tspan>, <tspan fill="#7ee2b8">'Antigravity::Execute'</tspan>];
    </text>
    <text x="864" y="0" text-anchor="end" fill="#3dd68c">● VERIFIED</text>
  </g>
</svg>
