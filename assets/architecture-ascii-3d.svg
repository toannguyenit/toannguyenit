<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgArch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08080a" />
      <stop offset="100%" stop-color="#0b0b0e" />
    </linearGradient>

    <linearGradient id="tierTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#262630" />
      <stop offset="100%" stop-color="#15151b" />
    </linearGradient>
    <linearGradient id="tierTopHi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#32323e" />
      <stop offset="100%" stop-color="#191921" />
    </linearGradient>
    <linearGradient id="tierLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#17171e" />
      <stop offset="100%" stop-color="#0b0b0f" />
    </linearGradient>
    <linearGradient id="tierRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#101015" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>

    <filter id="slabShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="12" flood-color="#000000" flood-opacity="0.72" />
    </filter>
  </defs>

  <style>
    .sans { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .mono { font-family: 'Geist Mono', 'JetBrains Mono', 'Fira Code', Consolas, monospace; }

    @keyframes tierFloat1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
    }
    @keyframes tierFloat2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    @keyframes tierFloat3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
    }
    @keyframes pulseBus {
      to { stroke-dashoffset: -48; }
    }

    .t-1 { animation: tierFloat1 4.6s ease-in-out infinite; }
    .t-2 { animation: tierFloat2 4.6s ease-in-out infinite 0.4s; }
    .t-3 { animation: tierFloat3 4.6s ease-in-out infinite 0.8s; }
    .bus-line { stroke-dasharray: 6 6; animation: pulseBus 2s linear infinite; }
  </style>

  <!-- Carbon Background -->
  <rect width="960" height="560" rx="16" fill="url(#bgArch)" />

  <!-- Architectural Frame & Dividers -->
  <rect x="24" y="16" width="912" height="528" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1" />
  <line x1="24" y1="88" x2="936" y2="88" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1" />
  <line x1="24" y1="498" x2="936" y2="498" stroke="#ffffff" stroke-opacity="0.09" stroke-width="1" />
  <line x1="436" y1="88" x2="436" y2="498" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Corner Crosshair '+' Marks -->
  <g stroke="#ffffff" stroke-opacity="0.32" stroke-width="1">
    <line x1="18" y1="88" x2="30" y2="88" /><line x1="24" y1="82" x2="24" y2="94" />
    <line x1="930" y1="88" x2="942" y2="88" /><line x1="936" y1="82" x2="936" y2="94" />
    <line x1="430" y1="88" x2="442" y2="88" /><line x1="436" y1="82" x2="436" y2="94" />
    <line x1="18" y1="498" x2="30" y2="498" /><line x1="24" y1="492" x2="24" y2="504" />
    <line x1="930" y1="498" x2="942" y2="498" /><line x1="936" y1="492" x2="936" y2="504" />
    <line x1="430" y1="498" x2="442" y2="498" /><line x1="436" y1="492" x2="436" y2="504" />
  </g>

  <!-- Section Header -->
  <g transform="translate(48, 44)">
    <text x="0" y="0" fill="#878791" font-size="11.5" font-weight="500" letter-spacing="1.2" class="mono">
      02 // 4-TIER SYSTEM TOPOLOGY &amp; TECH ARSENAL
    </text>
    <text x="0" y="26" fill="#ededef" font-size="24" font-weight="600" letter-spacing="-0.8" class="sans">
      3D Full-Stack &amp; Cloud Architecture
    </text>
    <text x="864" y="24" text-anchor="end" fill="#878791" font-size="12" class="mono">
      DEPLOYMENT: <tspan fill="#ededef">CLOUD &amp; LAN</tspan> · STATUS: <tspan fill="#3dd68c">PRODUCTION</tspan>
    </text>
  </g>

  <!-- ========================================================= -->
  <!-- LEFT COLUMN: ASCII-REVEAL INDEXED STEPS (.steps / .step)  -->
  <!-- ========================================================= -->
  <g transform="translate(48, 118)">
    <!-- Step 01 -->
    <text x="0" y="18" fill="#878791" font-size="12" font-weight="500" class="mono">01</text>
    <text x="38" y="18" fill="#ededef" font-size="16" font-weight="600" letter-spacing="-0.3" class="sans">Languages &amp; Core Runtime</text>
    <rect x="38" y="28" width="328" height="44" rx="10" fill="#101014" stroke="#ffffff" stroke-opacity="0.09" />
    <text x="52" y="47" fill="#7ee2b8" font-size="12" font-weight="500" class="mono">Java · Go (Golang) · PHP · Python</text>
    <text x="52" y="64" fill="#a3a3ac" font-size="11.5" class="mono">TypeScript · JavaScript</text>

    <line x1="0" y1="88" x2="366" y2="88" stroke="#ffffff" stroke-opacity="0.08" />

    <!-- Step 02 -->
    <text x="0" y="114" fill="#878791" font-size="12" font-weight="500" class="mono">02</text>
    <text x="38" y="114" fill="#ededef" font-size="16" font-weight="600" letter-spacing="-0.3" class="sans">Frameworks &amp; Libraries</text>
    <rect x="38" y="124" width="328" height="44" rx="10" fill="#101014" stroke="#ffffff" stroke-opacity="0.09" />
    <text x="52" y="143" fill="#7cc4ff" font-size="12" font-weight="500" class="mono">Spring Boot · Laravel · NestJS</text>
    <text x="52" y="160" fill="#a3a3ac" font-size="11.5" class="mono">React · Next.js · Vue.js · Tailwind CSS</text>

    <line x1="0" y1="184" x2="366" y2="184" stroke="#ffffff" stroke-opacity="0.08" />

    <!-- Step 03 -->
    <text x="0" y="210" fill="#878791" font-size="12" font-weight="500" class="mono">03</text>
    <text x="38" y="210" fill="#ededef" font-size="16" font-weight="600" letter-spacing="-0.3" class="sans">Databases &amp; High-Speed Cache</text>
    <rect x="38" y="220" width="328" height="44" rx="10" fill="#101014" stroke="#ffffff" stroke-opacity="0.09" />
    <text x="52" y="239" fill="#f5c27a" font-size="12" font-weight="500" class="mono">PostgreSQL · MySQL · MongoDB</text>
    <text x="52" y="256" fill="#a3a3ac" font-size="11.5" class="mono">Redis (Cache-Aside, Queues, Locks)</text>

    <line x1="0" y1="280" x2="366" y2="280" stroke="#ffffff" stroke-opacity="0.08" />

    <!-- Step 04 -->
    <text x="0" y="306" fill="#878791" font-size="12" font-weight="500" class="mono">04</text>
    <text x="38" y="306" fill="#ededef" font-size="16" font-weight="600" letter-spacing="-0.3" class="sans">DevOps, Cloud &amp; Tooling</text>
    <rect x="38" y="316" width="328" height="44" rx="10" fill="#101014" stroke="#ffffff" stroke-opacity="0.09" />
    <text x="52" y="335" fill="#ff8fb7" font-size="12" font-weight="500" class="mono">Docker · AWS · NGINX · Linux</text>
    <text x="52" y="352" fill="#a3a3ac" font-size="11.5" class="mono">Storage · GG Workspace</text>
  </g>

  <!-- ========================================================= -->
  <!-- RIGHT COLUMN: LARGE-SCALE 4-TIER 3D ISOMETRIC MONOLITH    -->
  <!-- ========================================================= -->
  <g transform="translate(450, 88)">
    <!-- Subtle Background ASCII Matrix -->
    <g font-size="11" class="mono" fill="#ffffff" fill-opacity="0.11" letter-spacing="3">
      <text x="24" y="32">+ · : ░ ▒ ▓ █ T O P O L O G Y █ ▓ ▒ ░ : · +</text>
      <text x="24" y="388">+ · : ░ ▒ ▓ █ I N F R A _ 3 D █ ▓ ▒ ░ : · +</text>
    </g>

    <!-- TIER 04 (BOTTOM): DEVOPS, CLOUD, STORAGE & WORKSPACE -->
    <g filter="url(#slabShadow)">
      <polygon points="235,248 450,312 235,376 20,312" fill="url(#tierTop)" stroke="#ffffff" stroke-opacity="0.22" stroke-width="1.2" />
      <polygon points="20,312 235,376 235,400 20,336" fill="url(#tierLeft)" stroke="#ffffff" stroke-opacity="0.12" />
      <polygon points="450,312 235,376 235,400 450,336" fill="url(#tierRight)" stroke="#ffffff" stroke-opacity="0.08" />
      <text x="235" y="308" text-anchor="middle" fill="#ededef" font-size="12.5" font-weight="600" letter-spacing="1" class="mono">
        DOCKER · AWS · NGINX · LINUX
      </text>
      <text x="235" y="326" text-anchor="middle" fill="#ff8fb7" font-size="11" font-weight="500" letter-spacing="0.8" class="mono">
        [ 04 // STORAGE &amp; GG WORKSPACE ]
      </text>
    </g>

    <!-- TIER 03 (LOWER-MID): DATABASES & HIGH-SPEED CACHE -->
    <g class="t-3" filter="url(#slabShadow)">
      <polygon points="235,176 450,240 235,304 20,240" fill="url(#tierTop)" stroke="#ffffff" stroke-opacity="0.26" stroke-width="1.2" />
      <polygon points="20,240 235,304 235,328 20,264" fill="url(#tierLeft)" stroke="#ffffff" stroke-opacity="0.14" />
      <polygon points="450,240 235,304 235,328 450,264" fill="url(#tierRight)" stroke="#ffffff" stroke-opacity="0.1" />
      <text x="235" y="236" text-anchor="middle" fill="#ededef" font-size="12.5" font-weight="600" letter-spacing="1" class="mono">
        POSTGRESQL · MYSQL · MONGODB · REDIS
      </text>
      <text x="235" y="254" text-anchor="middle" fill="#f5c27a" font-size="11" font-weight="500" letter-spacing="0.8" class="mono">
        [ 03 // PERSISTENCE &amp; DISTRIBUTED CACHE ]
      </text>
    </g>

    <!-- TIER 02 (UPPER-MID): FRAMEWORKS & LIBRARIES -->
    <g class="t-2" filter="url(#slabShadow)">
      <polygon points="235,104 450,168 235,232 20,168" fill="url(#tierTopHi)" stroke="#ffffff" stroke-opacity="0.32" stroke-width="1.2" />
      <polygon points="20,168 235,232 235,256 20,192" fill="url(#tierLeft)" stroke="#ffffff" stroke-opacity="0.16" />
      <polygon points="450,168 235,232 235,256 450,192" fill="url(#tierRight)" stroke="#ffffff" stroke-opacity="0.12" />
      <text x="235" y="164" text-anchor="middle" fill="#ededef" font-size="12.5" font-weight="600" letter-spacing="0.8" class="mono">
        SPRING BOOT · LARAVEL · NESTJS · REACT · NEXT.JS
      </text>
      <text x="235" y="182" text-anchor="middle" fill="#7cc4ff" font-size="11" font-weight="500" letter-spacing="0.8" class="mono">
        [ 02 // VUE.JS &amp; TAILWIND CSS ]
      </text>
    </g>

    <!-- TIER 01 (TOP): LANGUAGES & CORE + AI VIBECODING -->
    <g class="t-1" filter="url(#slabShadow)">
      <polygon points="235,32 450,96 235,160 20,96" fill="url(#tierTopHi)" stroke="#ededef" stroke-opacity="0.45" stroke-width="1.5" />
      <polygon points="20,96 235,160 235,184 20,120" fill="#1a1a22" stroke="#ffffff" stroke-opacity="0.2" />
      <polygon points="450,96 235,160 235,184 450,120" fill="#111117" stroke="#ffffff" stroke-opacity="0.14" />
      <text x="235" y="92" text-anchor="middle" fill="#ededef" font-size="13" font-weight="600" letter-spacing="1" class="mono">
        JAVA · GO (GOLANG) · PHP · PYTHON · TS · JS
      </text>
      <text x="235" y="110" text-anchor="middle" fill="#7ee2b8" font-size="11" font-weight="600" letter-spacing="0.8" class="mono">
        [ 01 // CORE LANGUAGES &amp; AI VIBECODING ]
      </text>
    </g>

    <!-- Vertical Precision Telemetry Bus Lines -->
    <line x1="95" y1="96" x2="95" y2="312" stroke="#ededef" stroke-opacity="0.35" stroke-width="1.5" class="bus-line" />
    <line x1="375" y1="96" x2="375" y2="312" stroke="#3dd68c" stroke-opacity="0.45" stroke-width="1.5" class="bus-line" />
  </g>

  <!-- Bottom Telemetry Bar -->
  <g transform="translate(48, 524)" font-size="12" class="mono" fill="#878791">
    <text x="0" y="0">
      RUNTIME: <tspan fill="#ededef">JVM · GO RUNTIME · NODE · PHP-FPM</tspan>
    </text>
    <text x="450" y="0">
      INFRA: <tspan fill="#ededef">DOCKER · AWS · NGINX · LINUX · STORAGE · GG WORKSPACE</tspan>
    </text>
  </g>
</svg>
