<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" width="100%" height="100%">
  <defs>
    <linearGradient id="vibeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a18" />
      <stop offset="50%" stop-color="#0c1126" />
      <stop offset="100%" stop-color="#060914" />
    </linearGradient>

    <!-- Claude Card Gradients (Warm Amber/Orange 3D) -->
    <linearGradient id="claudeBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
    <linearGradient id="claudeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="claudeLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="claudeRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Codex Card Gradients (Emerald/Cyan 3D) -->
    <linearGradient id="codexBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="codexTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a7f3d0" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="codexLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="codexRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>

    <!-- Antigravity Card Gradients (Violet/Magenta/Cyan 3D) -->
    <linearGradient id="agyBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>
    <linearGradient id="agyTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5d0fe" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <linearGradient id="agyLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <linearGradient id="agyRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7e22ce" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>

    <filter id="cardShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="8" flood-color="#000000" flood-opacity="0.65" />
    </filter>
  </defs>

  <style>
    .font-main { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }

    @keyframes hoverCard1 {
      0%, 100% { transform: translate(55px, 95px) translateY(0px); }
      50% { transform: translate(55px, 95px) translateY(-8px); }
    }
    @keyframes hoverCard2 {
      0%, 100% { transform: translate(430px, 85px) translateY(0px); }
      50% { transform: translate(430px, 85px) translateY(-10px); }
    }
    @keyframes hoverCard3 {
      0%, 100% { transform: translate(805px, 95px) translateY(0px); }
      50% { transform: translate(805px, 95px) translateY(-8px); }
    }
    @keyframes streamPulse {
      to { stroke-dashoffset: -80; }
    }

    .card-claude { animation: hoverCard1 4.5s ease-in-out infinite; }
    .card-codex { animation: hoverCard2 4.5s ease-in-out infinite 0.6s; }
    .card-agy { animation: hoverCard3 4.5s ease-in-out infinite 1.2s; }
    .energy-line { stroke-dasharray: 10 6; animation: streamPulse 2.2s linear infinite; }
  </style>

  <!-- Outer 3D Stage -->
  <rect width="1200" height="430" rx="20" fill="url(#vibeBg)" stroke="#1e293b" stroke-width="2" />

  <!-- Header Bar -->
  <g transform="translate(600, 38)" text-anchor="middle">
    <text x="0" y="0" fill="#f8fafc" font-size="22" font-weight="800" letter-spacing="1.2" class="font-main">
      🧊 AI-NATIVE VIBECODING ENGINE — 1+ YEAR PRODUCTION EXPERIENCE
    </text>
    <text x="0" y="24" fill="#94a3b8" font-size="13" font-weight="500" class="font-mono">
      Orchestrating Multi-Model AI Agents for System Architecture, High-Speed Coding &amp; Automated Verification
    </text>
  </g>

  <!-- Connecting 3D Neural Pipelines Behind Cards -->
  <line x1="360" y1="225" x2="450" y2="225" stroke="#f59e0b" stroke-width="3" class="energy-line" />
  <line x1="750" y1="225" x2="830" y2="225" stroke="#c084fc" stroke-width="3" class="energy-line" />

  <!-- ========================================================= -->
  <!-- CARD 1: CLAUDE (DEEP ARCHITECT & REASONING ENGINE)        -->
  <!-- ========================================================= -->
  <g class="card-claude" filter="url(#cardShadow)">
    <!-- 3D Extruded Depth Base -->
    <rect x="8" y="10" width="340" height="260" rx="16" fill="#451a03" opacity="0.85" />
    <!-- Card Surface -->
    <rect x="0" y="0" width="340" height="260" rx="16" fill="#0d1326" stroke="url(#claudeBorder)" stroke-width="2" />

    <!-- Isometric 3D Icon Cube -->
    <g transform="translate(22, 20)">
      <polygon points="35,5 65,20 35,35 5,20" fill="url(#claudeTop)" />
      <polygon points="5,20 35,35 35,68 5,53" fill="url(#claudeLeft)" />
      <polygon points="65,20 35,35 35,68 65,53" fill="url(#claudeRight)" />
      <text x="35" y="24" text-anchor="middle" fill="#451a03" font-size="9" font-weight="900" class="font-mono">AI-01</text>
    </g>

    <!-- Title & Exp Badge -->
    <text x="102" y="46" fill="#fde68a" font-size="20" font-weight="800" class="font-main">Claude (Anthropic)</text>
    <rect x="102" y="56" width="175" height="22" rx="6" fill="#451a03" stroke="#f59e0b" stroke-width="1" />
    <text x="189" y="71" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="700" class="font-mono">1+ YR • ARCHITECT CORE</text>

    <line x1="24" y1="100" x2="316" y2="100" stroke="#1e293b" stroke-width="1.5" />

    <!-- Capabilities -->
    <text x="24" y="128" fill="#e2e8f0" font-size="13" font-weight="600" class="font-main">▸ System Architecture &amp; DDD Design</text>
    <text x="24" y="154" fill="#e2e8f0" font-size="13" font-weight="600" class="font-main">▸ Deep Refactoring (Java / Golang)</text>
    <text x="24" y="180" fill="#e2e8f0" font-size="13" font-weight="600" class="font-main">▸ Complex SQL &amp; Concurrency Tuning</text>
    <text x="24" y="206" fill="#e2e8f0" font-size="13" font-weight="600" class="font-main">▸ Edge-Case Security &amp; Code Review</text>

    <!-- Bottom Progress Bar -->
    <rect x="24" y="226" width="292" height="14" rx="7" fill="#1e293b" />
    <rect x="24" y="226" width="275" height="14" rx="7" fill="url(#claudeBorder)" />
    <text x="170" y="237" text-anchor="middle" fill="#090d16" font-size="9.5" font-weight="900" class="font-mono">VIBECODE MASTERY: 95%</text>
  </g>

  <!-- ========================================================= -->
  <!-- CARD 2: CODEX (HIGH-VELOCITY EXECUTION & SYNTHESIS)       -->
  <!-- ========================================================= -->
  <g class="card-codex" filter="url(#cardShadow)">
    <!-- 3D Extruded Depth Base -->
    <rect x="8" y="10" width="340" height="260" rx="16" fill="#064e3b" opacity="0.85" />
    <!-- Card Surface -->
    <rect x="0" y="0" width="340" height="260" rx="16" fill="#0d1326" stroke="url(#codexBorder)" stroke-width="2" />

    <!-- Isometric 3D Icon Cube -->
    <g transform="translate(22, 20)">
      <polygon points="35,5 65,20 35,35 5,20" fill="url(#codexTop)" />
      <polygon points="5,20 35,35 35,68 5,53" fill="url(#codexLeft)" />
      <polygon points="65,20 35,35 35,68 65,53" fill="url(#codexRight)" />
      <text x="35" y="24" text-anchor="middle" fill="#022c22" font-size="9" font-weight="900" class="font-mono">AI-02</text>
    </g>

    <!-- Title & Exp Badge -->
    <text x="102" y="46" fill="#a7f3d0" font-size="20" font-weight="800" class="font-main">OpenAI Codex</text>
    <rect x="102" y="56" width="185" height="22" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1" />
    <text x="194" y="71" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="700" class="font-mono">1+ YR • SPEED ENGINE</text>

    <line x1="24" y1="100" x2="316" y2="100" stroke="#1e293b" stroke-width="1.5" />

    <!-- Capabilities -->
    <text x="24" y="128" fill="#e2e8f0" font-size="13" font-weight="600" class="font-main">▸ Rapid API &amp; Microservice Scaffolding</text>
    <text x="24" y="154" fill="#e2e8f0" font-size="13" font-weight="600" class="font-main">▸ Automated Unit &amp; Integration Tests</text>
    <text x="24" y="180" fill="#e2e8f0" font-size="13" font-weight="600" class="font-main">▸ CI/CD Pipelines &amp; Docker Automation</text>
    <text x="24" y="206" fill="#e2e8f0" font-size="13" font-weight="600" class="font-main">▸ Multi-Repo Bug Hunting &amp; Fixes</text>

    <!-- Bottom Progress Bar -->
    <rect x="24" y="226" width="292" height="14" rx="7" fill="#1e293b" />
    <rect x="24" y="226" width="270" height="14" rx="7" fill="url(#codexBorder)" />
    <text x="170" y="237" text-anchor="middle" fill="#022c22" font-size="9.5" font-weight="900" class="font-mono">VIBECODE MASTERY: 94%</text>
  </g>

  <!-- ========================================================= -->
  <!-- CARD 3: ANTIGRAVITY (AGENTIC FULL-STACK & 3D IDE)         -->
  <!-- ========================================================= -->
  <g class="card-agy" filter="url(#cardShadow)">
    <!-- 3D Extruded Depth Base -->
    <rect x="8" y="10" width="340" height="260" rx="16" fill="#3b0764" opacity="0.85" />
    <!-- Card Surface -->
    <rect x="0" y="0" width="340" height="260" rx="16" fill="#0d1326" stroke="url(#agyBorder)" stroke-width="2" />

    <!-- Isometric 3D Icon Cube -->
    <g transform="translate(22, 20)">
      <polygon points="35,5 65,20 35,35 5,20" fill="url(#agyTop)" />
      <polygon points="5,20 35,35 35,68 5,53" fill="url(#agyLeft)" />
      <polygon points="65,20 35,35 35,68 65,53" fill="url(#agyRight)" />
      <text x="35" y="24" text-anchor="middle" fill="#2e1065" font-size="9" font-weight="900" class="font-mono">AI-03</text>
    </g>

    <!-- Title & Exp Badge -->
    <text x="102" y="46" fill="#f5d0fe" font-size="20" font-weight="800" class="font-main">Antigravity</text>
    <rect x="102" y="56" width="195" height="22" rx="6" fill="#3b0764" stroke="#e879f9" stroke-width="1" />
    <text x="199" y="71" text-anchor="middle" fill="#f0abfc" font-size="11" font-weight="700" class="font-mono">1+ YR • AGENTIC ORCHESTRATOR</text>

    <line x1="24" y1="100" x2="316" y2="100" stroke="#1e293b" stroke-width="1.5" />

    <!-- Capabilities -->
    <text x="24" y="128" fill="#e2e8f0" font-size="13" font-weight="600" class="font-main">▸ Autonomous Multi-Agent Workflows</text>
    <text x="24" y="154" fill="#e2e8f0" font-size="13" font-weight="600" class="font-main">▸ End-to-End Feature &amp; UI/3D Delivery</text>
    <text x="24" y="180" fill="#e2e8f0" font-size="13" font-weight="600" class="font-main">▸ Custom Skills, MCP Tools &amp; Rules</text>
    <text x="24" y="206" fill="#e2e8f0" font-size="13" font-weight="600" class="font-main">▸ Live Terminal, Browser &amp; Code Sync</text>

    <!-- Bottom Progress Bar -->
    <rect x="24" y="226" width="292" height="14" rx="7" fill="#1e293b" />
    <rect x="24" y="226" width="280" height="14" rx="7" fill="url(#agyBorder)" />
    <text x="170" y="237" text-anchor="middle" fill="#090d16" font-size="9.5" font-weight="900" class="font-mono">VIBECODE MASTERY: 96%</text>
  </g>

  <!-- Bottom 3D Telemetry Bar -->
  <g transform="translate(55, 378)">
    <rect x="0" y="0" width="1090" height="36" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1.2" />
    <text x="545" y="23" text-anchor="middle" fill="#38bdf8" font-size="12.5" font-weight="700" letter-spacing="1" class="font-mono">
      ⚡ VIBECODING IMPACT:  3.5x Faster Feature Delivery  •  90%+ Spec-to-Code Accuracy  •  Clean Architecture Enforced
    </text>
  </g>
</svg>
