<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050816" />
      <stop offset="45%" stop-color="#090d24" />
      <stop offset="100%" stop-color="#040711" />
    </linearGradient>

    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#4facfe" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00f2fe" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#6366f1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
    </radialGradient>

    <!-- 3D Cube Face Gradients -->
    <linearGradient id="cubeTopCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cubeLeftCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#164e63" />
    </linearGradient>
    <linearGradient id="cubeRightCyan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e7490" />
      <stop offset="100%" stop-color="#083344" />
    </linearGradient>

    <linearGradient id="cubeTopPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e879f9" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="cubeLeftPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>
    <linearGradient id="cubeRightPurple" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#7e22ce" />
      <stop offset="100%" stop-color="#2e1065" />
    </linearGradient>

    <linearGradient id="cubeTopAmber" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cubeLeftAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="cubeRightAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Text & Card Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="45%" stop-color="#bae6fd" />
      <stop offset="75%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="goldBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <linearGradient id="gridLine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.35" />
    </linearGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    .font-main { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }

    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-14px); }
    }
    @keyframes floatMed {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes floatReverse {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(12px); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.45; }
      50% { opacity: 0.9; }
    }
    @keyframes dashFlow {
      to { stroke-dashoffset: -120; }
    }
    @keyframes scanline {
      0% { transform: translateY(250px); opacity: 0; }
      30% { opacity: 0.7; }
      80% { opacity: 0.7; }
      100% { transform: translateY(410px); opacity: 0; }
    }

    .float-1 { animation: floatSlow 5s ease-in-out infinite; }
    .float-2 { animation: floatMed 4s ease-in-out infinite 0.7s; }
    .float-3 { animation: floatReverse 4.5s ease-in-out infinite 1.2s; }
    .pulse { animation: pulseGlow 3.5s ease-in-out infinite; }
    .data-stream { stroke-dasharray: 8 6; animation: dashFlow 3s linear infinite; }
    .scan-bar { animation: scanline 6s linear infinite; }
  </style>

  <!-- Main 3D Stage Background -->
  <rect width="1200" height="420" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Ambient 3D Lighting Orbs -->
  <circle cx="220" cy="180" r="240" fill="url(#glowCyan)" class="pulse" />
  <circle cx="960" cy="190" r="260" fill="url(#glowPurple)" class="pulse" />
  <circle cx="620" cy="340" r="200" fill="url(#glowAmber)" />

  <!-- 3D Perspective Cyber Floor Grid -->
  <g opacity="0.45">
    <line x1="0" y1="270" x2="1200" y2="270" stroke="#1e293b" stroke-width="1" />
    <line x1="0" y1="292" x2="1200" y2="292" stroke="#1e293b" stroke-width="1" />
    <line x1="0" y1="318" x2="1200" y2="318" stroke="#0f172a" stroke-width="1.2" />
    <line x1="0" y1="348" x2="1200" y2="348" stroke="#1e293b" stroke-width="1.5" />
    <line x1="0" y1="382" x2="1200" y2="382" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5" />

    <!-- Perspective Rays from Vanishing Point (600, 200) -->
    <line x1="600" y1="270" x2="-100" y2="420" stroke="url(#gridLine)" stroke-width="1.2" />
    <line x1="600" y1="270" x2="100" y2="420" stroke="url(#gridLine)" stroke-width="1.2" />
    <line x1="600" y1="270" x2="280" y2="420" stroke="url(#gridLine)" stroke-width="1.2" />
    <line x1="600" y1="270" x2="440" y2="420" stroke="url(#gridLine)" stroke-width="1.2" />
    <line x1="600" y1="270" x2="600" y2="420" stroke="url(#gridLine)" stroke-width="1.2" />
    <line x1="600" y1="270" x2="760" y2="420" stroke="url(#gridLine)" stroke-width="1.2" />
    <line x1="600" y1="270" x2="920" y2="420" stroke="url(#gridLine)" stroke-width="1.2" />
    <line x1="600" y1="270" x2="1100" y2="420" stroke="url(#gridLine)" stroke-width="1.2" />
    <line x1="600" y1="270" x2="1300" y2="420" stroke="url(#gridLine)" stroke-width="1.2" />
  </g>

  <!-- Animated Laser Scanline on 3D Floor -->
  <line x1="80" y1="0" x2="1120" y2="0" stroke="#38bdf8" stroke-width="2" opacity="0.5" filter="url(#neonGlow)" class="scan-bar" />

  <!-- ========================================================= -->
  <!-- LEFT 3D ISOMETRIC CLUSTER: BACKEND & CLOUD ARCHITECTURE   -->
  <!-- ========================================================= -->
  <g transform="translate(55, 65)">
    <!-- Isometric Base Platform -->
    <g filter="url(#softShadow)">
      <polygon points="130,210 240,265 130,320 20,265" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <polygon points="20,265 130,320 130,334 20,279" fill="#0284c7" opacity="0.7" />
      <polygon points="240,265 130,320 130,334 240,279" fill="#0369a1" opacity="0.9" />
    </g>

    <!-- Floating 3D Cube 1: Java & Spring Boot Core -->
    <g class="float-1" filter="url(#softShadow)">
      <!-- Top -->
      <polygon points="130,90 195,122 130,154 65,122" fill="url(#cubeTopCyan)" />
      <!-- Left -->
      <polygon points="65,122 130,154 130,230 65,198" fill="url(#cubeLeftCyan)" />
      <!-- Right -->
      <polygon points="195,122 130,154 130,230 195,198" fill="url(#cubeRightCyan)" />
      <!-- Glowing Wireframe Edges -->
      <polyline points="65,122 130,154 195,122" fill="none" stroke="#cffafe" stroke-width="1.5" />
      <line x1="130" y1="154" x2="130" y2="230" stroke="#67e8f9" stroke-width="1.5" />
      <!-- Server Blade Lights -->
      <line x1="80" y1="148" x2="115" y2="165" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" />
      <line x1="80" y1="165" x2="115" y2="182" stroke="#22d3ee" stroke-width="3" stroke-linecap="round" />
      <line x1="80" y1="182" x2="115" y2="199" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" />
      <text x="130" y="127" text-anchor="middle" fill="#042f2e" font-size="12" font-weight="800" class="font-mono">JAVA • GO</text>
    </g>

    <!-- Floating Mini 3D Cube Left: Microservices -->
    <g class="float-2" transform="translate(-35, 35)">
      <polygon points="60,150 95,168 60,186 25,168" fill="url(#cubeTopPurple)" />
      <polygon points="25,168 60,186 60,225 25,207" fill="url(#cubeLeftPurple)" />
      <polygon points="95,168 60,186 60,225 95,207" fill="url(#cubeRightPurple)" />
      <text x="60" y="172" text-anchor="middle" fill="#ffffff" font-size="9" font-weight="700" class="font-mono">DOCKER</text>
    </g>

    <!-- Floating Mini 3D Cube Right: Database/Redis -->
    <g class="float-3" transform="translate(145, 25)">
      <polygon points="60,150 95,168 60,186 25,168" fill="url(#cubeTopAmber)" />
      <polygon points="25,168 60,186 60,225 25,207" fill="url(#cubeLeftAmber)" />
      <polygon points="95,168 60,186 60,225 95,207" fill="url(#cubeRightAmber)" />
      <text x="60" y="172" text-anchor="middle" fill="#451a03" font-size="9" font-weight="800" class="font-mono">REDIS</text>
    </g>
  </g>

  <!-- ========================================================= -->
  <!-- CENTER 3D HOLOGRAPHIC HERO IDENTITY                       -->
  <!-- ========================================================= -->
  <g transform="translate(600, 62)" text-anchor="middle">
    <!-- Top 3D Pill Badge -->
    <g filter="url(#softShadow)">
      <rect x="-230" y="0" width="460" height="34" rx="17" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <circle cx="-205" cy="17" r="5" fill="#10b981" filter="url(#neonGlow)" />
      <text x="8" y="22" fill="#e2e8f0" font-size="12.5" font-weight="700" letter-spacing="1.5" class="font-mono">
        SOFTWARE ENGINEER • AI-NATIVE VIBECODER
      </text>
    </g>

    <!-- 3D Extruded Main Name Shadow + Highlight -->
    <text x="3" y="99" fill="#020617" font-size="48" font-weight="900" letter-spacing="3" class="font-mono">
      toannguyenit
    </text>
    <text x="1.5" y="97.5" fill="#0284c7" font-size="48" font-weight="900" letter-spacing="3" class="font-mono" opacity="0.65">
      toannguyenit
    </text>
    <text x="0" y="96" fill="url(#titleGrad)" font-size="48" font-weight="900" letter-spacing="3" class="font-mono" filter="url(#neonGlow)">
      toannguyenit
    </text>

    <!-- Role Subtitle -->
    <text x="0" y="132" fill="#94a3b8" font-size="16" font-weight="600" letter-spacing="0.8" class="font-main">
      Java &amp; Golang Backend Specialist  |  Microservices  |  Full-Cycle AI Engineering
    </text>

    <!-- 3D Highlight Card: 1+ Year Vibecoding Experience -->
    <g transform="translate(0, 156)" filter="url(#softShadow)">
      <!-- 3D Card Depth Layer -->
      <rect x="-296" y="5" width="592" height="78" rx="14" fill="#3b0764" opacity="0.7" />
      <!-- Main Glass Card -->
      <rect x="-300" y="0" width="600" height="76" rx="14" fill="#0b1120" stroke="url(#goldBadge)" stroke-width="2" />

      <!-- Left Fire Badge -->
      <rect x="-284" y="14" width="136" height="48" rx="10" fill="url(#goldBadge)" />
      <text x="-216" y="35" fill="#090d16" font-size="13" font-weight="900" class="font-mono">1+ YEAR EXP</text>
      <text x="-216" y="52" fill="#090d16" font-size="12" font-weight="800" class="font-mono">⚡ VIBECODING</text>

      <!-- Right AI Trio Pills -->
      <text x="-130" y="29" text-anchor="start" fill="#f8fafc" font-size="14" font-weight="700" class="font-main">
        AI-Augmented Architecture &amp; Rapid Delivery with:
      </text>

      <!-- Claude Pill -->
      <g transform="translate(-130, 39)">
        <rect x="0" y="0" width="118" height="25" rx="6" fill="#1e1b4b" stroke="#f59e0b" stroke-width="1.2" />
        <circle cx="14" cy="12.5" r="4" fill="#f59e0b" />
        <text x="64" y="16.5" fill="#fde68a" font-size="11.5" font-weight="700" class="font-mono">Claude AI</text>
      </g>

      <!-- Codex Pill -->
      <g transform="translate(-2, 39)">
        <rect x="0" y="0" width="124" height="25" rx="6" fill="#064e3b" stroke="#10b981" stroke-width="1.2" />
        <circle cx="14" cy="12.5" r="4" fill="#10b981" />
        <text x="67" y="16.5" fill="#a7f3d0" font-size="11.5" font-weight="700" class="font-mono">OpenAI Codex</text>
      </g>

      <!-- Antigravity Pill -->
      <g transform="translate(132, 39)">
        <rect x="0" y="0" width="148" height="25" rx="6" fill="#311042" stroke="#e879f9" stroke-width="1.2" />
        <circle cx="14" cy="12.5" r="4" fill="#e879f9" />
        <text x="80" y="16.5" fill="#f5d0fe" font-size="11.5" font-weight="700" class="font-mono">Antigravity</text>
      </g>
    </g>

    <!-- Bottom Status & Location Bar -->
    <g transform="translate(0, 265)">
      <text x="0" y="0" fill="#38bdf8" font-size="13" font-weight="600" letter-spacing="1.2" class="font-mono">
        📍 HO CHI MINH CITY, VIETNAM   •   🌐 TOANNGUYENIT.COM   •   🚀 10X AGENTIC WORKFLOW
      </text>
    </g>
  </g>

  <!-- ========================================================= -->
  <!-- RIGHT 3D ISOMETRIC CLUSTER: AI VIBECODING REACTOR         -->
  <!-- ========================================================= -->
  <g transform="translate(915, 65)">
    <!-- Isometric Base Platform -->
    <g filter="url(#softShadow)">
      <polygon points="115,210 225,265 115,320 5,265" fill="#0f172a" stroke="#c084fc" stroke-width="1.5" />
      <polygon points="5,265 115,320 115,334 5,279" fill="#7e22ce" opacity="0.7" />
      <polygon points="225,265 115,320 115,334 225,279" fill="#581c87" opacity="0.9" />
    </g>

    <!-- Energy Core Beams -->
    <line x1="115" y1="150" x2="115" y2="265" stroke="#e879f9" stroke-width="3" class="data-stream" filter="url(#neonGlow)" />

    <!-- Floating 3D AI Core Cube: Antigravity / Claude / Codex -->
    <g class="float-2" filter="url(#softShadow)">
      <!-- Top -->
      <polygon points="115,85 180,117 115,149 50,117" fill="url(#cubeTopPurple)" />
      <!-- Left -->
      <polygon points="50,117 115,149 115,225 50,193" fill="url(#cubeLeftPurple)" />
      <!-- Right -->
      <polygon points="180,117 115,149 115,225 180,193" fill="url(#cubeRightPurple)" />
      <!-- Neon Edge Highlight -->
      <polyline points="50,117 115,149 180,117" fill="none" stroke="#f5d0fe" stroke-width="1.5" />
      <line x1="115" y1="149" x2="115" y2="225" stroke="#e879f9" stroke-width="1.5" />
      <text x="115" y="122" text-anchor="middle" fill="#2e1065" font-size="11.5" font-weight="900" class="font-mono">AI AGENTS</text>
      <!-- Neural Core Symbol on Left & Right faces -->
      <circle cx="82" cy="172" r="14" fill="none" stroke="#f0abfc" stroke-width="2" />
      <circle cx="82" cy="172" r="5" fill="#f0abfc" />
      <circle cx="148" cy="172" r="14" fill="none" stroke="#38bdf8" stroke-width="2" />
      <circle cx="148" cy="172" r="5" fill="#38bdf8" />
    </g>

    <!-- Orbiting Mini 3D Cube 1: Claude -->
    <g class="float-1" transform="translate(-30, 20)">
      <polygon points="55,155 88,172 55,189 22,172" fill="url(#cubeTopAmber)" />
      <polygon points="22,172 55,189 55,224 22,207" fill="url(#cubeLeftAmber)" />
      <polygon points="88,172 55,189 55,224 88,207" fill="url(#cubeRightAmber)" />
      <text x="55" y="176" text-anchor="middle" fill="#451a03" font-size="8.5" font-weight="800" class="font-mono">CLAUDE</text>
    </g>

    <!-- Orbiting Mini 3D Cube 2: Codex -->
    <g class="float-3" transform="translate(135, 30)">
      <polygon points="55,155 88,172 55,189 22,172" fill="url(#cubeTopCyan)" />
      <polygon points="22,172 55,189 55,224 22,207" fill="url(#cubeLeftCyan)" />
      <polygon points="88,172 55,189 55,224 88,207" fill="url(#cubeRightCyan)" />
      <text x="55" y="176" text-anchor="middle" fill="#042f2e" font-size="8.5" font-weight="800" class="font-mono">CODEX</text>
    </g>
  </g>

  <!-- Connecting 3D Data Streams across Stage -->
  <path d="M 275 270 Q 430 330 590 295" fill="none" stroke="#38bdf8" stroke-width="2" class="data-stream" opacity="0.65" />
  <path d="M 925 270 Q 770 330 610 295" fill="none" stroke="#e879f9" stroke-width="2" class="data-stream" opacity="0.65" />
</svg>
