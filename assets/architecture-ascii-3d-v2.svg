<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="100%" height="100%">
  <defs>
    <linearGradient id="bgArch" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#0c0c10" />
    </linearGradient>

    <linearGradient id="tierTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2c2c38" />
      <stop offset="100%" stop-color="#181820" />
    </linearGradient>
    <linearGradient id="tierTopHi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#383846" />
      <stop offset="100%" stop-color="#1e1e28" />
    </linearGradient>
    <linearGradient id="tierLeft" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e1e27" />
      <stop offset="100%" stop-color="#101015" />
    </linearGradient>
    <linearGradient id="tierRight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#14141b" />
      <stop offset="100%" stop-color="#09090d" />
    </linearGradient>
  </defs>

  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace; }

    @keyframes tierFloat1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes tierFloat2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes tierFloat3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-2px); }
    }
    @keyframes pulseBus {
      to { stroke-dashoffset: -48; }
    }

    .t-1 { animation: tierFloat1 4.5s ease-in-out infinite; }
    .t-2 { animation: tierFloat2 4.5s ease-in-out infinite 0.4s; }
    .t-3 { animation: tierFloat3 4.5s ease-in-out infinite 0.8s; }
    .bus-line { stroke-dasharray: 6 6; animation: pulseBus 2.2s linear infinite; }
  </style>

  <!-- Carbon Background -->
  <rect width="960" height="560" rx="16" fill="url(#bgArch)" stroke="#262630" stroke-width="1.5" />

  <!-- Architectural Frame & Dividers -->
  <rect x="24" y="16" width="912" height="528" fill="none" stroke="#262630" stroke-width="1" />
  <line x1="24" y1="88" x2="936" y2="88" stroke="#262630" stroke-width="1" />
  <line x1="24" y1="498" x2="936" y2="498" stroke="#262630" stroke-width="1" />
  <line x1="436" y1="88" x2="436" y2="498" stroke="#22222b" stroke-width="1" stroke-dasharray="4 4" />

  <!-- Corner Crosshair '+' Marks -->
  <g stroke="#636370" stroke-width="1.2">
    <line x1="18" y1="88" x2="30" y2="88" /><line x1="24" y1="82" x2="24" y2="94" />
    <line x1="930" y1="88" x2="942" y2="88" /><line x1="936" y1="82" x2="936" y2="94" />
    <line x1="430" y1="88" x2="442" y2="88" /><line x1="436" y1="82" x2="436" y2="94" />
    <line x1="18" y1="498" x2="30" y2="498" /><line x1="24" y1="492" x2="24" y2="504" />
    <line x1="930" y1="498" x2="942" y2="498" /><line x1="936" y1="492" x2="936" y2="504" />
    <line x1="430" y1="498" x2="442" y2="498" /><line x1="436" y1="492" x2="436" y2="504" />
  </g>

  <!-- Section Header -->
  <g transform="translate(46, 44)">
    <text x="0" y="0" fill="#a3a3ac" font-size="11.5" font-weight="600" letter-spacing="1.2" class="mono">
      02 // 4-TIER SYSTEM TOPOLOGY &amp; TECH ARSENAL
    </text>
    <text x="0" y="26" fill="#ededef" font-size="24" font-weight="700" letter-spacing="-0.6" class="sans">
      3D Full-Stack &amp; Cloud Architecture
    </text>
    <text x="868" y="24" text-anchor="end" fill="#a3a3ac" font-size="12" class="mono">
      DEPLOYMENT: <tspan fill="#ededef" font-weight="700">CLOUD &amp; LAN</tspan> / STATUS: <tspan fill="#3dd68c" font-weight="700">PRODUCTION</tspan>
    </text>
  </g>

  <!-- ========================================================= -->
  <!-- LEFT COLUMN: ASCII-REVEAL INDEXED STEPS (.steps / .step)  -->
  <!-- ========================================================= -->
  <g transform="translate(46, 116)">
    <!-- Step 01 -->
    <text x="0" y="18" fill="#878791" font-size="12" font-weight="700" class="mono">01</text>
    <text x="36" y="18" fill="#ededef" font-size="16" font-weight="700" class="sans">Languages &amp; Core Runtime</text>
    <rect x="36" y="28" width="332" height="44" rx="10" fill="#121218" stroke="#2c2c38" stroke-width="1" />
    <text x="50" y="47" fill="#7ee2b8" font-size="12" font-weight="600" class="mono">Java / Go (Golang) / PHP / Python</text>
    <text x="50" y="64" fill="#a3a3ac" font-size="11.5" class="mono">TypeScript / JavaScript</text>

    <line x1="0" y1="88" x2="368" y2="88" stroke="#22222b" stroke-width="1" />

    <!-- Step 02 -->
    <text x="0" y="114" fill="#878791" font-size="12" font-weight="700" class="mono">02</text>
    <text x="36" y="114" fill="#ededef" font-size="16" font-weight="700" class="sans">Frameworks &amp; Libraries</text>
    <rect x="36" y="124" width="332" height="44" rx="10" fill="#121218" stroke="#2c2c38" stroke-width="1" />
    <text x="50" y="143" fill="#7cc4ff" font-size="12" font-weight="600" class="mono">Spring Boot / Laravel / NestJS</text>
    <text x="50" y="160" fill="#a3a3ac" font-size="11.5" class="mono">React / Next.js / Vue.js / Tailwind CSS</text>

    <line x1="0" y1="184" x2="368" y2="184" stroke="#22222b" stroke-width="1" />

    <!-- Step 03 -->
    <text x="0" y="210" fill="#878791" font-size="12" font-weight="700" class="mono">03</text>
    <text x="36" y="210" fill="#ededef" font-size="16" font-weight="700" class="sans">Databases &amp; High-Speed Cache</text>
    <rect x="36" y="220" width="332" height="44" rx="10" fill="#121218" stroke="#2c2c38" stroke-width="1" />
    <text x="50" y="239" fill="#f5c27a" font-size="12" font-weight="600" class="mono">PostgreSQL / MySQL / MongoDB</text>
    <text x="50" y="256" fill="#a3a3ac" font-size="11.5" class="mono">Redis (Cache-Aside, Queues, Locks)</text>

    <line x1="0" y1="280" x2="368" y2="280" stroke="#22222b" stroke-width="1" />

    <!-- Step 04 -->
    <text x="0" y="306" fill="#878791" font-size="12" font-weight="700" class="mono">04</text>
    <text x="36" y="306" fill="#ededef" font-size="16" font-weight="700" class="sans">DevOps, Cloud &amp; Tooling</text>
    <rect x="36" y="316" width="332" height="44" rx="10" fill="#121218" stroke="#2c2c38" stroke-width="1" />
    <text x="50" y="335" fill="#ff8fb7" font-size="12" font-weight="600" class="mono">Docker / AWS / NGINX / Linux</text>
    <text x="50" y="352" fill="#a3a3ac" font-size="11.5" class="mono">Storage / Google Workspace</text>
  </g>

  <!-- ========================================================= -->
  <!-- RIGHT COLUMN: LARGE-SCALE 4-TIER 3D ISOMETRIC MONOLITH    -->
  <!-- ========================================================= -->
  <g transform="translate(450, 88)">
    <!-- Pure ASCII Background Matrix -->
    <g font-size="11" class="mono" fill="#525263" letter-spacing="2.5">
      <text x="20" y="30">+ . : - = + * # [ T O P O L O G Y ] # * + = - : .</text>
      <text x="20" y="392">+ . : - = + * # [ I N F R A _ 3 D ] # * + = - : .</text>
    </g>

    <!-- Floor Shadow Polygon -->
    <polygon points="235,268 452,332 235,396 18,332" fill="#040406" opacity="0.85" />

    <!-- TIER 04 (BOTTOM): DEVOPS, CLOUD, STORAGE & WORKSPACE -->
    <g>
      <polygon points="235,248 450,312 235,376 20,312" fill="url(#tierTop)" stroke="#4a4a5a" stroke-width="1.2" />
      <polygon points="20,312 235,376 235,400 20,336" fill="url(#tierLeft)" stroke="#343442" stroke-width="1" />
      <polygon points="450,312 235,376 235,400 450,336" fill="url(#tierRight)" stroke="#262632" stroke-width="1" />
      <text x="235" y="308" text-anchor="middle" fill="#ededef" font-size="12" font-weight="700" letter-spacing="0.8" class="mono">
        DOCKER / AWS / NGINX / LINUX
      </text>
      <text x="235" y="326" text-anchor="middle" fill="#ff8fb7" font-size="11" font-weight="700" letter-spacing="0.8" class="mono">
        [ 04 // STORAGE &amp; GOOGLE WORKSPACE ]
      </text>
    </g>

    <!-- TIER 03 (LOWER-MID): DATABASES & HIGH-SPEED CACHE -->
    <g class="t-3">
      <polygon points="235,190 446,252 235,314 24,252" fill="#050508" opacity="0.7" />
      <polygon points="235,176 450,240 235,304 20,240" fill="url(#tierTop)" stroke="#5a5a6e" stroke-width="1.2" />
      <polygon points="20,240 235,304 235,328 20,264" fill="url(#tierLeft)" stroke="#3b3b4a" stroke-width="1" />
      <polygon points="450,240 235,304 235,328 450,264" fill="url(#tierRight)" stroke="#2c2c38" stroke-width="1" />
      <text x="235" y="236" text-anchor="middle" fill="#ededef" font-size="12" font-weight="700" letter-spacing="0.8" class="mono">
        POSTGRESQL / MYSQL / MONGODB / REDIS
      </text>
      <text x="235" y="254" text-anchor="middle" fill="#f5c27a" font-size="11" font-weight="700" letter-spacing="0.8" class="mono">
        [ 03 // PERSISTENCE &amp; DISTRIBUTED CACHE ]
      </text>
    </g>

    <!-- TIER 02 (UPPER-MID): FRAMEWORKS & LIBRARIES -->
    <g class="t-2">
      <polygon points="235,118 446,180 235,242 24,180" fill="#050508" opacity="0.7" />
      <polygon points="235,104 450,168 235,232 20,168" fill="url(#tierTopHi)" stroke="#6e6e85" stroke-width="1.3" />
      <polygon points="20,168 235,232 235,256 20,192" fill="url(#tierLeft)" stroke="#454556" stroke-width="1" />
      <polygon points="450,168 235,232 235,256 450,192" fill="url(#tierRight)" stroke="#323240" stroke-width="1" />
      <text x="235" y="164" text-anchor="middle" fill="#ededef" font-size="12" font-weight="700" letter-spacing="0.6" class="mono">
        SPRING BOOT / LARAVEL / NESTJS / REACT / NEXT.JS
      </text>
      <text x="235" y="182" text-anchor="middle" fill="#7cc4ff" font-size="11" font-weight="700" letter-spacing="0.8" class="mono">
        [ 02 // VUE.JS &amp; TAILWIND CSS ]
      </text>
    </g>

    <!-- TIER 01 (TOP): LANGUAGES & CORE + AI VIBECODING -->
    <g class="t-1">
      <polygon points="235,46 446,108 235,170 24,108" fill="#050508" opacity="0.75" />
      <polygon points="235,32 450,96 235,160 20,96" fill="url(#tierTopHi)" stroke="#a3a3b8" stroke-width="1.5" />
      <polygon points="20,96 235,160 235,184 20,120" fill="#20202a" stroke="#525266" stroke-width="1" />
      <polygon points="450,96 235,160 235,184 450,120" fill="#15151d" stroke="#3b3b4a" stroke-width="1" />
      <text x="235" y="92" text-anchor="middle" fill="#ffffff" font-size="12.5" font-weight="700" letter-spacing="0.8" class="mono">
        JAVA / GO (GOLANG) / PHP / PYTHON / TS / JS
      </text>
      <text x="235" y="110" text-anchor="middle" fill="#7ee2b8" font-size="11" font-weight="700" letter-spacing="0.8" class="mono">
        [ 01 // CORE LANGUAGES &amp; AI VIBECODING ]
      </text>
    </g>

    <!-- Vertical Precision Telemetry Bus Lines -->
    <line x1="92" y1="96" x2="92" y2="312" stroke="#7cc4ff" stroke-opacity="0.5" stroke-width="1.5" class="bus-line" />
    <line x1="378" y1="96" x2="378" y2="312" stroke="#3dd68c" stroke-opacity="0.55" stroke-width="1.5" class="bus-line" />
  </g>

  <!-- Bottom Telemetry Bar -->
  <g transform="translate(46, 524)" font-size="12" class="mono" fill="#a3a3ac">
    <text x="0" y="0">
      RUNTIME: <tspan fill="#ededef" font-weight="600">JVM / GO RUNTIME / NODE / PHP-FPM</tspan>
    </text>
    <text x="442" y="0">
      INFRA: <tspan fill="#ededef" font-weight="600">DOCKER / AWS / NGINX / LINUX / STORAGE / GG WORKSPACE</tspan>
    </text>
  </g>
</svg>
