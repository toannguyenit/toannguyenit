<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 450" width="100%" height="100%">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0b1124" />
      <stop offset="100%" stop-color="#050814" />
    </linearGradient>

    <!-- Layer 1: AI Vibecoding Plane -->
    <linearGradient id="planeAiTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c1d95" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#831843" stop-opacity="0.88" />
    </linearGradient>

    <!-- Layer 2: Frontend Plane -->
    <linearGradient id="planeFeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c4a6e" stop-opacity="0.88" />
      <stop offset="100%" stop-color="#1e3a8a" stop-opacity="0.88" />
    </linearGradient>

    <!-- Layer 3: Backend Core Plane -->
    <linearGradient id="planeBeTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f766e" stop-opacity="0.9" />
    </linearGradient>

    <!-- Layer 4: Data & Cloud Plane -->
    <linearGradient id="planeDbTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.95" />
    </linearGradient>

    <filter id="layerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="8" flood-color="#000000" flood-opacity="0.7" />
    </filter>
  </defs>

  <style>
    .font-main { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif; }
    .font-mono { font-family: 'Fira Code', 'JetBrains Mono', Consolas, monospace; }

    @keyframes floatStack1 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-9px); }
    }
    @keyframes floatStack2 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }
    @keyframes floatStack3 {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }
    @keyframes dataVertical {
      to { stroke-dashoffset: -60; }
    }

    .stack-1 { animation: floatStack1 4.2s ease-in-out infinite; }
    .stack-2 { animation: floatStack2 4.2s ease-in-out infinite 0.4s; }
    .stack-3 { animation: floatStack3 4.2s ease-in-out infinite 0.8s; }
    .v-beam { stroke-dasharray: 6 6; animation: dataVertical 1.8s linear infinite; }
  </style>

  <rect width="1200" height="450" rx="20" fill="url(#archBg)" stroke="#1e293b" stroke-width="2" />

  <!-- Section Title Left -->
  <g transform="translate(55, 52)">
    <text x="0" y="0" fill="#38bdf8" font-size="13" font-weight="800" letter-spacing="2" class="font-mono">
      ISOMETRIC 4-TIER SYSTEM STACK
    </text>
    <text x="0" y="32" fill="#f8fafc" font-size="26" font-weight="900" class="font-main">
      3D Full-Stack &amp; AI Architecture
    </text>
    <text x="0" y="58" fill="#94a3b8" font-size="13.5" class="font-main">
      Layered engineering architecture combining solid enterprise
    </text>
    <text x="0" y="78" fill="#94a3b8" font-size="13.5" class="font-main">
      backends with next-gen AI Vibecoding orchestration.
    </text>

    <!-- Legend Callouts Left -->
    <g transform="translate(0, 112)">
      <!-- Tier 01 -->
      <rect x="0" y="0" width="380" height="54" rx="10" fill="#0f172a" stroke="#e879f9" stroke-width="1.5" />
      <text x="16" y="22" fill="#f5d0fe" font-size="13" font-weight="800" class="font-mono">01 // AI VIBECODING LAYER (1+ YR)</text>
      <text x="16" y="41" fill="#cbd5e1" font-size="12" class="font-main">Claude • OpenAI Codex • Google Antigravity • MCP</text>

      <!-- Tier 02 -->
      <rect x="0" y="68" width="380" height="54" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" />
      <text x="16" y="90" fill="#bae6fd" font-size="13" font-weight="800" class="font-mono">02 // FRONTEND &amp; EDGE UI</text>
      <text x="16" y="109" fill="#cbd5e1" font-size="12" class="font-main">Next.js • React • Vue.js • TypeScript • Tailwind CSS</text>

      <!-- Tier 03 -->
      <rect x="0" y="136" width="380" height="54" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
      <text x="16" y="158" fill="#a7f3d0" font-size="13" font-weight="800" class="font-mono">03 // HIGH-PERFORMANCE BACKEND CORE</text>
      <text x="16" y="177" fill="#cbd5e1" font-size="12" class="font-main">Java • Spring Boot • Golang • gRPC • Laravel • NestJS</text>

      <!-- Tier 04 -->
      <rect x="0" y="204" width="380" height="54" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" />
      <text x="16" y="226" fill="#fde68a" font-size="13" font-weight="800" class="font-mono">04 // DATA, CLOUD, STORAGE &amp; WORKSPACE</text>
      <text x="16" y="245" fill="#cbd5e1" font-size="11.5" class="font-main">Postgres • Redis • Docker • AWS • Linux • Storage • GG Workspace</text>
    </g>
  </g>

  <!-- ========================================================= -->
  <!-- RIGHT SIDE: 3D FLOATING ISOMETRIC STACKED PLANES          -->
  <!-- ========================================================= -->
  <g transform="translate(490, 15)">

    <!-- LAYER 4 (BOTTOM): DATA, CACHE & CLOUD INFRA -->
    <g filter="url(#layerShadow)">
      <polygon points="340,265 620,335 340,405 60,335" fill="url(#planeDbTop)" stroke="#f59e0b" stroke-width="2" />
      <polygon points="60,335 340,405 340,422 60,352" fill="#92400e" />
      <polygon points="620,335 340,405 340,422 620,352" fill="#451a03" />
      <text x="340" y="332" text-anchor="middle" fill="#fef3c7" font-size="13.5" font-weight="900" letter-spacing="1" class="font-mono">
        POSTGRES • REDIS • DOCKER • AWS • STORAGE • GG WORKSPACE
      </text>
      <text x="340" y="354" text-anchor="middle" fill="#fcd34d" font-size="11" font-weight="700" class="font-mono">
        [ TIER 04: DATA, LINUX, CLOUD STORAGE &amp; WORKSPACE ]
      </text>
    </g>

    <!-- LAYER 3 (LOWER-MID): BACKEND MICROSERVICES CORE -->
    <g class="stack-3" filter="url(#layerShadow)">
      <polygon points="340,185 620,255 340,325 60,255" fill="url(#planeBeTop)" stroke="#10b981" stroke-width="2" />
      <polygon points="60,255 340,325 340,342 60,272" fill="#047857" />
      <polygon points="620,255 340,325 340,342 620,272" fill="#064e3b" />
      <text x="340" y="252" text-anchor="middle" fill="#ecfdf5" font-size="15.5" font-weight="900" letter-spacing="1.2" class="font-mono">
        JAVA SPRING BOOT • GOLANG • gRPC • LARAVEL
      </text>
      <text x="340" y="274" text-anchor="middle" fill="#6ee7b7" font-size="11" font-weight="700" class="font-mono">
        [ TIER 03: MICROSERVICES &amp; RESTFUL API ENGINE ]
      </text>
    </g>

    <!-- LAYER 2 (UPPER-MID): FRONTEND & MODERN WEB -->
    <g class="stack-2" filter="url(#layerShadow)">
      <polygon points="340,105 620,175 340,245 60,175" fill="url(#planeFeTop)" stroke="#38bdf8" stroke-width="2" />
      <polygon points="60,175 340,245 340,262 60,192" fill="#0284c7" />
      <polygon points="620,175 340,245 340,262 620,192" fill="#0c4a6e" />
      <text x="340" y="172" text-anchor="middle" fill="#f0f9ff" font-size="15" font-weight="900" letter-spacing="1.2" class="font-mono">
        NEXT.JS • REACT • VUE.JS • TYPESCRIPT
      </text>
      <text x="340" y="194" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="700" class="font-mono">
        [ TIER 02: INTERACTIVE CLIENT &amp; SSR PORTALS ]
      </text>
    </g>

    <!-- LAYER 1 (TOP): AI VIBECODING COMMAND LAYER -->
    <g class="stack-1" filter="url(#layerShadow)">
      <polygon points="340,25 620,95 340,165 60,95" fill="url(#planeAiTop)" stroke="#f0abfc" stroke-width="2.2" />
      <polygon points="60,95 340,165 340,182 60,112" fill="#9333ea" />
      <polygon points="620,95 340,165 340,182 620,112" fill="#581c87" />
      <text x="340" y="90" text-anchor="middle" fill="#ffffff" font-size="16" font-weight="900" letter-spacing="1.5" class="font-mono">
        ✨ CLAUDE • CODEX • ANTIGRAVITY ✨
      </text>
      <text x="340" y="114" text-anchor="middle" fill="#f5d0fe" font-size="11.5" font-weight="800" class="font-mono">
        [ TIER 01: 1+ YR AI-NATIVE VIBECODING ORCHESTRATION ]
      </text>
    </g>

    <!-- Vertical Laser Beams Connecting All 4 Isometric Layers -->
    <line x1="160" y1="95" x2="160" y2="335" stroke="#38bdf8" stroke-width="2.5" class="v-beam" opacity="0.8" />
    <line x1="520" y1="95" x2="520" y2="335" stroke="#e879f9" stroke-width="2.5" class="v-beam" opacity="0.8" />
    <line x1="340" y1="165" x2="340" y2="405" stroke="#10b981" stroke-width="2.5" class="v-beam" opacity="0.8" />
  </g>
</svg>
